<!doctype html>
<!-- data-theme is what first-time visitors get (keep equal to DEFAULT_THEME in src/themes/registry.ts). -->
<html lang="en" data-theme="frontend-mentor">
  <head>
    <meta charset="UTF-8" />
    <!-- Restore the saved theme before first paint so there is no flash of the wrong one.
         "rps-theme" is STORAGE_KEY in src/themes/registry.ts. -->
    <script>
      try {
        var saved = localStorage.getItem("rps-theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141539" />
    <meta
      name="description"
      content="Rock Paper Scissors against an AI that learns your habits. Includes the Lizard Spock bonus game."
    />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
